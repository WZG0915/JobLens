# Python 打包工具首先读取这一段，决定使用 setuptools 构建项目。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 项目的名称、版本、Python 版本以及运行时依赖。
[project]
name = "joblens"
version = "0.1.0"
description = "A beginner-friendly internship job analysis and interview preparation agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
  "pdfplumber>=0.11,<0.11.10",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# 开发环境依赖：运行自动测试时安装。
dev = [
  "pytest>=8.0",
]
# 外部大模型模式依赖；本地解析不需要安装。
llm = [
  "openai>=2.30,<3",
]
# 扫描版 PDF 的可选 OCR Python 依赖；仍需系统安装 Tesseract/Poppler。
ocr = [
  "Pillow>=10,<12",
  "pytesseract>=0.3.13,<1",
]
# 本地 RAG 为可选重依赖；普通解析、匹配和 Agent 工具无需安装。
rag = [
  "chromadb>=1.0,<2",
  "sentence-transformers>=3.0,<6",
]
# 本地对话网页；需要与 rag 依赖一起安装才能执行完整推荐。
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
]

# 告诉 setuptools 从 src 目录发现 joblens 包。
[tool.setuptools.packages.find]
where = ["src"]

# 将HTML、CSS和JavaScript一起打包，安装后仍可直接启动网页。
[tool.setuptools.package-data]
"joblens.web" = ["static/*.html", "static/*.css", "static/*.js"]

# pytest 默认扫描 tests，并把 src 加入导入路径。
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
